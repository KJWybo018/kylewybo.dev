  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="page-grid">

    <!-- HEADER -->
    <header class="site-header">
      <h1 class="logo">Kyle Wybo</h1>
      <nav class="nav">
          <a href="/kylewybo.dev/index.html">Home</a>
          <a href="../project/projects.html">Projects</a>
          <a href="../about/about.html">About</a>
          <a href="../contact/contact.html" class="active">Contact</a>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="content contact-grid">

      <section class="contact-info">
        <h2>Get in Touch</h2>
        <p>
          Whether you want to collaborate, discuss engineering challenges, or explore opportunities,
          I’m always open to connecting.
        </p>

        <div class="contact-details">
          <p><strong>Email:</strong> <a href="mailto:kylewybo@gmail.com" target="_blank">kylewybo@gmail.com</a></p>
          <p><strong>GitHub:</strong> <a href="https://www.github.com/KJWybo018" target="_blank">github.com/KJWybo018</a></p>

        </div>
      </section>

      <section class="contact-form">
        <form>
          <label>Name</label>
          <input type="text" required>

          <label>Email</label>
          <input type="email" required>

          <label>Message</label>
          <textarea rows="6" required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </section>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
