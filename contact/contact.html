<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact | Kyle Wybo</title>
  <link rel="stylesheet" href="../assets/style/global.css">
  <link rel="stylesheet" href="../assets/style/contact.css">
  <link rel="stylesheet" href="../assets/style/responsive.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="page-grid">

    <!-- HEADER -->
    <header class="site-header">
      <h1 class="logo">Kyle Wybo</h1>
      <nav class="nav">
          <a href="/kylewybo.dev/index.html">Home</a>
          <a href="../project/projects.html">Projects</a>
          <a href="../about/about.html">About</a>
          <a href="../contact/contact.html" class="active">Contact</a>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="content contact-grid">

      <section class="contact-info">
        <h2>Get in Touch</h2>
        <p>
          Whether you want to collaborate, discuss engineering challenges, or explore opportunities,
          I’m always open to connecting.
        </p>

        <div class="contact-details">
          <p><strong>Email:</strong> <a href="mailto:kylewybo@gmail.com" target="_blank">kylewybo@gmail.com</a></p>
          <p><strong>GitHub:</strong> <a href="https://www.github.com/KJWybo018" target="_blank">github.com/KJWybo018</a></p>
          <p><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/in/kyle-wybo" target="_blank">linkedin.com/in/kyle-wybo</a></p>
        </div>
      </section>

      <section class="contact-form">
        <form action="275b282fe1bb45f31ea954232eae05eb" method="POST">

          <!-- FormSubmit settings -->
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_next" value="https://kjjwybo018.github.io/kylewybo.dev/contact/success.html">
        
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" maxlength="600" required></textarea>
        
          <button type="submit" class="button-primary">Send Message</button>
        </form>
      </section>

    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <p>© 2025 Kyle Wybo</p>
    </footer>

  </div>
</body>
</html>
